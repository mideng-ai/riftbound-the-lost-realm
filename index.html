<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- 内联空图标：避免浏览器自动请求 /favicon.ico 产生 404（试玩控制台需零 404） -->
    <link rel="icon" href="data:," />
    <title>Riftbound: The Lost Realm — Playable Demo</title>
    <style>
      html, body { margin: 0; padding: 0; overflow: hidden; background: #0b0d12; }
      #renderCanvas { width: 100vw; height: 100vh; display: block; touch-action: none; outline: none; }
      /* 旧 TASK-02 调试 HUD：默认隐藏，避免与 TASK-07 真 HUD（z50）叠出两套矛盾数值。
         main.ts 在 ?debug=1 时把它改为 display:block，旧轮询逻辑完整保留供对照。 */
      #hud {
        position: fixed; top: 8px; left: 8px; z-index: 10; display: none;
        font: 12px/1.5 monospace; color: #d8e6ff; background: rgba(5, 8, 16, 0.75);
        padding: 8px 10px; border-radius: 6px; white-space: pre; pointer-events: none;
      }
      #actions { position: fixed; right: 16px; bottom: 16px; z-index: 20; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .abtn {
        width: 64px; height: 64px; border-radius: 50%; border: 2px solid #3a5a8a;
        background: rgba(30, 45, 80, 0.7); color: #cfe0ff; font: 13px monospace;
        touch-action: none; user-select: none; -webkit-user-select: none;
      }
      .abtn:active { background: rgba(70, 110, 180, 0.8); }
      #joyBase, #joyKnob { position: fixed; z-index: 15; border-radius: 50%; pointer-events: none; display: none; }
      #joyBase { width: 96px; height: 96px; border: 2px solid rgba(140,170,220,0.5); background: rgba(40,60,100,0.25); }
      #joyKnob { width: 44px; height: 44px; background: rgba(160,190,240,0.55); }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <div id="hud">initializing…</div>
    <div id="joyBase"></div>
    <div id="joyKnob"></div>
    <div id="actions">
      <button class="abtn" id="btnAtk">ATK</button>
      <button class="abtn" id="btnDash">DASH</button>
      <!-- Q/E 当前无技能实现：隐藏按钮而不是留着点了没反应的死键。
           输入绑定与 intent 消费仍在 main.ts / BootstrapScene 中保留，待技能系统接入再放开。 -->
      <button class="abtn" id="btnQ" style="display:none">SKILL-Q</button>
      <button class="abtn" id="btnE" style="display:none">SKILL-E</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
